name: Links (Fail Fast)

on:
  pull_request:
jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Link Checker
        uses: lycheeverse/lychee-action@v1.6.1
        with:
            # Check all markdown and html files in repo (default)
            # 排除有反爬/限流策略、实际可用的站点，避免误报导致 PR 检查失败
            args: --verbose --no-progress --timeout 30 --max-redirects 3 --exclude 'dev\.mysql\.com' --exclude 'repo\.huaweicloud\.com/repository' README.md
            # Fail action on broken links
            fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}